# Chaîne d'intégration et de livraison continues de acquisition-plans-api.
# Ordre : qualité du code et contrôle des données -> tests -> évaluation de la
# recherche -> livraison de l'image Docker (seulement sur main).

name: CI/CD acquisition-plans-api

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  qualite:
    name: Qualité du code (Ruff, Black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Installation des outils
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: python -B -m ruff check --select E,F,B,SIM,C4,ARG acquisition_plans
      - name: Black
        run: python -B -m black --check acquisition_plans

  donnees:
    name: Contrôle des données sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Validation des plans, de la nomenclature, du guide et du flux RSS
        run: python -B -m acquisition_plans.tests.valider_donnees

  tests:
    name: Tests et couverture
    needs: [qualite, donnees]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Installation des dépendances
        run: python -m pip install -r requirements-dev.txt
      - name: Base de maintenance PostgreSQL (conteneur de test)
        run: |
          docker run -d --name base-maintenance -p 5433:5432 \
            -e POSTGRES_DB=maintenance -e POSTGRES_USER=lecteur \
            -e POSTGRES_PASSWORD=essai-ci \
            -v "$PWD/acquisition_plans/donnees/base_maintenance:/docker-entrypoint-initdb.d:ro" \
            postgres:17-alpine
          for essai in $(seq 1 30); do
            if docker exec base-maintenance psql -U lecteur -d maintenance -h 127.0.0.1 \
                 -tAc "SELECT count(*) FROM interventions"; then
              exit 0
            fi
            sleep 2
          done
          docker logs base-maintenance
          exit 1
      - name: Tests unitaires et d'intégration, avec mesure de couverture
        env:
          MAINTENANCE_DB_URL: postgresql://lecteur:essai-ci@127.0.0.1:5433/maintenance
        run: >-
          python -B -m coverage run --source=acquisition_plans --omit="*/tests/*"
          -m unittest discover -s acquisition_plans/tests -p "test_*.py" -v
      - name: Rapport de couverture (échec sous 85 %)
        run: |
          python -B -m coverage report --fail-under=85
          python -B -m coverage html -d rapport_couverture
      - name: Publication du rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-couverture
          path: rapport_couverture
          if-no-files-found: ignore

  evaluation:
    name: Évaluation de la recherche
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Questions de référence (échec sous les seuils)
        run: python -B -m acquisition_plans.tests.evaluer_recherche
      - name: Publication du rapport d'évaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-evaluation
          path: acquisition_plans/tests/rapport_evaluation_recherche.json
          if-no-files-found: ignore

  livraison:
    name: Construction, publication et vérification de l'image
    needs: [tests, evaluation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Nom de l'image en minuscules
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construction et publication
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
      - name: Vérification de l'image publiée
        run: |
          docker run -d --name verification -p 8000:8000 -e ADMIN_API_KEY=verification "$IMAGE:${GITHUB_SHA}"
          for essai in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo
              echo "Image publiée et fonctionnelle : $IMAGE:${GITHUB_SHA}"
              exit 0
            fi
            sleep 2
          done
          docker logs verification
          exit 1
